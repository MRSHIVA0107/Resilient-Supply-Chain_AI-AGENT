services:
  # 1. FastAPI Backend Service (Python 3.12 + Google OR-Tools)
  - type: web
    name: rsc-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: rsc-postgres
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "http://localhost:3000,https://rsc-frontend.onrender.com"

  # 2. Next.js 16 Frontend (React 19, TypeScript, OpenRouter AI Integration)
  - type: web
    name: rsc-frontend
    runtime: node
    rootDir: frontend
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: rsc-backend
          property: host
      - key: OPENROUTER_API_KEY
        sync: false
      - key: DEFAULT_MODEL
        value: meta-llama/llama-3.3-70b-instruct

databases:
  # 3. Managed PostgreSQL Database
  - name: rsc-postgres
    databaseName: supply_chain
    user: postgres
    plan: free
